name: C++ CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake --preset release -DVIDX_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset release
      - name: Run Hello World (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          output="$(./build/release/vidx)"
          test "$output" = 'Hello, world!'
      - name: Run Hello World (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = & ./build/release/vidx.exe
          if ($LASTEXITCODE -ne 0 -or $output -ne 'Hello, world!') {
            throw 'Hello World verification failed'
          }

  quality:
    name: Formatting and static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18 clang-format-18 clang-tidy-18
      - name: Configure
        env:
          CXX: clang++-18
        run: >-
          cmake --preset debug
          -DVIDX_WARNINGS_AS_ERRORS=ON
          -DVIDX_CLANG_FORMAT=/usr/bin/clang-format-18
          -DVIDX_CLANG_TIDY=/usr/bin/clang-tidy-18
      - name: Check formatting
        run: cmake --build --preset format-check
      - name: Analyze sources
        run: cmake --build --preset lint
